name: Palomar mechanical preflight
'on':
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identify:
    runs-on: ubuntu-24.04
    outputs:
      request_id: ${{ steps.request.outputs.request_id }}
    steps:
      - name: Identify the immutable verification request
        id: request
        shell: bash
        run: printf 'request_id=%s\n' "${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
  verify:
    needs: identify
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      request_id: ${{ needs.identify.outputs.request_id }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"project_path":"lean","comparator_config_path":"lean/comparator.json","formalization_metadata_path":"lean/formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
