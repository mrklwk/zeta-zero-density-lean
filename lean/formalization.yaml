  "status": {
    "scope": "For every fixed 3/4 < σ < 1 and ε > 0, Nζ(σ,T) ≪σ,ε T^(2(1−σ)+ε) for every real T ≥ 2. Here Nζ counts zeros with Re(ρ) ≥ σ and 0 < Im(ρ) ≤ T, with analytic multiplicity. Thus A(σ) ≤ 2 in the convention Nζ(σ,T) ≪σ,ε T^(A(σ)(1−σ)+ε). A proved adapter obtains this count from the underlying Lean theorem for the closed symmetric region Re(ρ) ≥ σ and |Im(ρ)| ≤ T. The positive constant C(σ, ε) is existential and chosen before T; no numerical value is supplied. The endpoint σ = 3/4 and ε = 0 are excluded.",
